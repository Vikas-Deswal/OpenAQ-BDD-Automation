name: Run Smoke Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull Docker image from Docker Hub
        run: |
          docker pull vikas3350/openaq-bdd:latest

      - name: Run tests in Docker container
        run: |
          docker run -e OPENAQ_API_KEY="$OPENAQ_API_KEY" \
            -v ${{ github.workspace }}/allure-results:/app/allure-results \
            vikas3350/openaq-bdd:latest

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results